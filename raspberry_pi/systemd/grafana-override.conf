# Grafana systemd service override
# Copy to: /etc/systemd/system/grafana-server.service.d/override.conf
# Run: sudo systemctl daemon-reload && sudo systemctl restart grafana-server

[Unit]
Requires=mnt-storage.mount
After=mnt-storage.mount network.target

[Service]
Environment=GF_SERVER_HTTP_PORT=3000
Restart=on-failure
RestartSec=10
