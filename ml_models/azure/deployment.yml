$schema: https://azuremlschemas.azureedge.net/latest/managedOnlineDeployment.schema.json
name: candidate-v1
endpoint_name: twinuvo-energy-ml
model: azureml:twinuvo-energy-model-bundle:1
environment: azureml:twinuvo-xgboost-inference:1
code_configuration:
  code: ../..
  scoring_script: ml_models/azure/score.py
instance_type: Standard_DS3_v2
instance_count: 1
request_settings:
  request_timeout_ms: 10000
  max_concurrent_requests_per_instance: 2
liveness_probe:
  initial_delay: 30
  period: 10
readiness_probe:
  initial_delay: 30
  period: 10
