name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # Job untuk Vue.js Frontend
  frontend-build:
    name: Build & Test Vue.js Frontend
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: 🔧 Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: view_virtual/package-lock.json
    
    - name: 📦 Install dependencies
      working-directory: ./view_virtual
      run: npm ci
    
    - name: 🔍 Lint code
      working-directory: ./view_virtual
      run: npm run lint --if-present || echo "Lint script not found, skipping..."
    
    - name: 🏗️ Build production
      working-directory: ./view_virtual
      run: npm run build
    
    - name: 🧪 Run tests
      working-directory: ./view_virtual
      run: npm test --if-present || echo "No tests found, skipping..."
    
    - name: 📊 Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: vue-build-${{ matrix.node-version }}
        path: view_virtual/dist
        retention-days: 7
  
  # Job untuk Security Audit
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: 🔧 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18
    
    - name: 🔐 Security audit - Frontend
      working-directory: ./view_virtual
      run: npm audit --audit-level=moderate || true
    
    - name: 🔐 Security audit - Azure Functions
      working-directory: './sensor iot/azure-setup/azure-function'
      run: npm audit --audit-level=moderate || true
      continue-on-error: true
  
  # Job untuk Azure Functions
  azure-functions-build:
    name: Build Azure Functions
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: 🔧 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18
        cache: 'npm'
        cache-dependency-path: 'sensor iot/azure-setup/azure-function/package-lock.json'
    
    - name: 📦 Install dependencies
      working-directory: './sensor iot/azure-setup/azure-function'
      run: npm ci
    
    - name: 🏗️ Build Functions
      working-directory: './sensor iot/azure-setup/azure-function'
      run: npm run build --if-present || echo "No build script, skipping..."
    
    - name: 📊 Upload Functions artifacts
      uses: actions/upload-artifact@v4
      with:
        name: azure-functions
        path: 'sensor iot/azure-setup/azure-function'
        retention-days: 7
  
  # Job Summary
  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [frontend-build, security-audit, azure-functions-build]
    if: always()
    
    steps:
    - name: ✅ All jobs completed
      run: |
        echo "## 🎉 Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "✅ Frontend Build: ${{ needs.frontend-build.result }}" >> $GITHUB_STEP_SUMMARY
        echo "✅ Security Audit: ${{ needs.security-audit.result }}" >> $GITHUB_STEP_SUMMARY
        echo "✅ Azure Functions: ${{ needs.azure-functions-build.result }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "🚀 Ready to deploy!" >> $GITHUB_STEP_SUMMARY
